[package]
name = "colorbalance-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
authors.workspace = true
description = "ColorBalance color engine: decode contract, chart model, profiles"

[features]
# Row-parallel demosaic and apply loops on rayon. Off for wasm32 builds.
parallel = ["dep:rayon"]

[dependencies]
rayon = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ocio = { workspace = true }
moxcms = { workspace = true }
jpeg-encoder = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
