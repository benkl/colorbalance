[package]
name = "colorbalance-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "ColorBalance Light-Table desktop application"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
colorbalance-core = { path = "../../../crates/colorbalance-core", features = ["parallel"] }
colorbalance-raw = { path = "../../../crates/colorbalance-raw" }
tempfile = "3"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
thiserror = "2"

[dev-dependencies]
colorbalance-fixtures = { path = "../../../crates/colorbalance-fixtures" }
tauri = { version = "=2.12.1", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

# `tauri dev` builds dependencies unoptimized, which makes RAW decode and preview
# rendering about ten times slower and keeps every core busy for seconds.
[profile.dev.package."*"]
opt-level = 3
