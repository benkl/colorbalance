name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release CLI
        run: cargo build --release -p colorbalance-cli

      - name: Behavioral smoke test
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/colorbalance
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary=target/release/colorbalance.exe
          fi
          output="$("$binary" decode-contract)"
          echo "$output"
          echo "$output" | grep -E -q '"decoder": "rawler-ahd"'
          echo "$output" | grep -q '"output-color": "raw"'
          echo "$output" | grep -q '"output-depth": "u16"'
          echo "$output" | grep -q '"no-auto-bright": true'
          echo "$output" | grep -q '"demosaic": "ahd"'
          echo "$output" | grep -q '"highlight": "clip"'

  wasm32:
    name: colorbalance-core on wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build core for wasm32
        run: cargo build -p colorbalance-core --target wasm32-unknown-unknown
