[workspace]
resolver = "2"
members = [
    "crates/colorbalance-core",
    "crates/colorbalance-raw",
    "crates/colorbalance-cli",
    "crates/colorbalance-fixtures",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/benkl/colorbalance"
license = "MIT"
authors = ["Benjamin Kleinert"]

[workspace.dependencies]
rayon = "1.10"
colorbalance-core = { path = "crates/colorbalance-core" }
colorbalance-raw = { path = "crates/colorbalance-raw" }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Pinned exactly: both are young crates and the output-space fixtures were
# measured against these versions (see docs/ARCHITECTURE.md D24).
ocio = "=0.1.0"
moxcms = { version = "=0.9.1", default-features = false }
# JPEG export (D25). jpeg-encoder is pure Rust and builds for wasm32, so it lives
# in core. kamadak-exif only reads source metadata and stays in colorbalance-raw.
jpeg-encoder = "=0.7.1"
kamadak-exif = "=0.6.1"

[profile.release]
lto = "thin"
