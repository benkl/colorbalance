[workspace]
resolver = "2"
members = [
    "crates/colorbalance-core",
    "crates/colorbalance-raw",
    "crates/colorbalance-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/benkl/colorbalance"

[workspace.dependencies]
colorbalance-core = { path = "crates/colorbalance-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
