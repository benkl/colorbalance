[workspace]
resolver = "2"
members = [
    "crates/colorbalance-core",
    "crates/colorbalance-raw",
    "crates/colorbalance-cli",
    "crates/colorbalance-fixtures",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/benkl/colorbalance"

[workspace.dependencies]
colorbalance-core = { path = "crates/colorbalance-core" }
colorbalance-raw = { path = "crates/colorbalance-raw" }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
